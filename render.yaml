services:
  - type: web
    name: shaadi-planner-backend
    runtime: node
    region: virginia

    buildCommand: pnpm install --frozen-lockfile && pnpm prisma generate && pnpm prisma migrate resolve --rolled-back 20260905000000_init && pnpm prisma migrate deploy

    startCommand: pnpm server

    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: shaadi-planner-db
          property: connectionString

      - key: FRONTEND_URL
        sync: false

      - key: SESSION_SECRET
        generateValue: true

      - key: COOKIE_SECRET
        generateValue: true

      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: shaadi-planner-frontend
    runtime: static
    region: virginia

    buildCommand: pnpm install --frozen-lockfile && pnpm build

    staticPublishPath: ./dist

    envVars:
      - key: VITE_API_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: shaadi-planner-db
    databaseName: shaadi_planner
    user: shaadi_user
    region: virginia