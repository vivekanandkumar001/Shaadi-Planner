services:
  - type: web
    name: shaadi-planner-backend
    env: node
    buildCommand: pnpm install && pnpm prisma generate && pnpm prisma db push
    startCommand: pnpm server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: shaadi-planner-db
          property: connectionString

  - type: web
    name: shaadi-planner-frontend
    env: static
    buildCommand: pnpm install && pnpm build
    staticPublishPath: ./dist

databases:
  - name: shaadi-planner-db
    databaseName: shaadi_planner
    user: shaadi_user
