services:
  - type: web
    name: shaadi-planner-backend
    runtime: node
    region: virginia

    buildCommand: pnpm install --frozen-lockfile && pnpm prisma generate && pnpm build:server && pnpm prisma migrate deploy

    startCommand: pnpm start

    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: shaadi-planner-db
          property: connectionString

      - key: FRONTEND_URL
        fromService:
          type: web
          name: shaadi-planner-frontend
          property: url

      - key: SESSION_SECRET
        generateValue: true

      - key: COOKIE_SECRET
        generateValue: true

      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: shaadi-planner-frontend
    runtime: static
    region: virginia

    buildCommand: pnpm install --frozen-lockfile && pnpm build

    staticPublishPath: ./dist

    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: shaadi-planner-backend
          property: url

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: shaadi-planner-db
    databaseName: shaadi_planner
    user: shaadi_user
    region: virginia